[package]
name = "three-wasm-rust"
version = "0.2.0"
edition = "2021"
description = "A Rust/WebAssembly scene engine with visibility culling and batched WebGL2 rendering"
license = "MIT"
repository = "https://github.com/sakorman/three-wasm-rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = "1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation", "WebGlVertexArrayObject"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
